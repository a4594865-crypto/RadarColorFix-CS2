name: Plugin builder and release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: 'preview'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build RadarColorFix.csproj -c Release -o ./RadarColorFix --no-self-contained -p:CopyLocalLockFileAssemblies=false

      - name: Create release asset
        run: |
          zip -r RadarColorFix.zip ./RadarColorFix

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarColorFix-官方純淨版
          path: ./RadarColorFix.zip
